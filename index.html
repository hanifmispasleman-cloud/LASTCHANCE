<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KasirKu – AI POS Multi-Tenant</title>
  <meta name="description" content="Aplikasi Kasir & POS berbasis AI untuk Multi-Bisnis (F&amp;B, Ritel, Otomotif)" />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50:  '#f0fdf4',
              100: '#dcfce7',
              400: '#4ade80',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
              900: '#14532d',
            }
          }
        }
      }
    };
  </script>

  <!-- Dexie.js (IndexedDB wrapper) -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>

  <!-- Babel Standalone (untuk transpile JSX di browser) -->
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body class="bg-gray-50 text-gray-900 antialiased">

  <!-- Mount point React -->
  <div id="root"></div>

  <!-- Database layer (harus dimuat sebelum app.js) -->
  <script src="./js/db.js"></script>

  <!-- Aplikasi utama React (JSX via Babel) -->
  <script type="text/babel" src="./js/app.js"></script>

</body>
</html>
